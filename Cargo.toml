[package]
name = "siftforge"
version = "0.1.1"
edition = "2021"
rust-version="1.80"
description="A safe, cross-platform CLI for organizing cluttered directories."
repository = "https://github.com/DavidAsrorxonov/siftforge"
homepage = "https://github.com/DavidAsrorxonov/siftforge"
documentation = "https://github.com/DavidAsrorxonov/siftforge#readme"
license="MIT"
keywords=["cli", "files", "organizer", "downloads", "filesystem"]
categories=["command-line-utilities", "filesystem"]
exclude = [
    "sessions/",
    "session-handover.md",
    "progress-tracker.md",
    "siftforge-build-blueprint-rust.md",
    "Cargo.toml.orig",
]

[[bin]]
name="siftforge"
path="src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1" , features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
predicates = "3"

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
